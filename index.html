<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCA CORPOELEC - Sistema Modular</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="fondo-decorativo" aria-hidden="true"></div>

    <header id="app-header" class="topbar hidden">
        <div class="brand">
            <img src="image.png" alt="Logo CORPOELEC" class="brand-logo">
            <div>
                <h1>SCA CORPOELEC</h1>
                <p>Sistema de Control de Acceso</p>
            </div>
        </div>
        <nav id="menu-principal" class="menu"></nav>
        <button id="btn-cerrar-sesion" class="btn btn-danger">Cerrar sesion</button>
    </header>

    <main class="layout">
        <section id="screen-login" class="screen"></section>
        <section id="screen-dashboard" class="screen hidden"></section>
        <section id="screen-empleados" class="screen hidden"></section>
        <section id="screen-asistencia" class="screen hidden"></section>
        <section id="screen-archivo" class="screen hidden"></section>
        <section id="screen-reportes" class="screen hidden"></section>
    </main>

    <template id="tpl-login">
        <article class="panel login-grid">
            <aside class="login-hero">
                <img src="imagen.png" alt="CORPOELEC" class="hero-logo">
                <h2>Acceso administrativo</h2>
                <p>Gestion de personal, asistencia y reportes con una estructura.</p>
                <img src="kilovatico.jpg" alt="Kilovatico" class="hero-mascota">
            </aside>
            <form id="form-login" class="form-card">
                <h3>Inicio de sesion</h3>
                <label class="field">
                    <span>Usuario</span>
                    <input id="login-user" type="text" required>
                </label>
                <label class="field">
                    <span>Clave</span>
                    <input id="login-pass" type="password" required>
                </label>
                <button class="btn btn-primary" type="submit">Ingresar</button>
                <p id="login-feedback" class="feedback"></p>
            </form>
        </article>
    </template>

    <template id="tpl-dashboard">
        <article class="panel">
            <div class="panel-head">
                <h2>Panel de control</h2>
                <p>Indicadores en tiempo real de la sede activa</p>
            </div>
            <div id="metricas-dashboard" class="metric-grid"></div>
            <section class="dashboard-focus">
                <div class="dashboard-focus-head">
                    <div>
                        <h3>Entradas del dia</h3>
                        <p>Distribucion por carnet, cedula e invitados para la fecha seleccionada.</p>
                    </div>
                    <label class="field dashboard-date-field">
                        <span>Fecha</span>
                        <input id="dashboard-fecha" type="date">
                    </label>
                </div>
                <div class="dashboard-filter-row">
                    <label class="field dashboard-filter-field">
                        <span>Empleado</span>
                        <select id="dashboard-filtro-empleado"></select>
                    </label>
                    <label class="field dashboard-filter-field">
                        <span>Departamento</span>
                        <select id="dashboard-filtro-departamento"></select>
                    </label>
                </div>
                <div class="dashboard-focus-grid">
                    <article class="dashboard-card dashboard-donut-card">
                        <div id="dashboard-donut" class="dashboard-donut"></div>
                    </article>
                    <article class="dashboard-card dashboard-summary-card">
                        <div id="dashboard-entry-summary" class="dashboard-summary-list"></div>
                    </article>
                </div>
            </section>
            <section class="dashboard-early-grid">
                <article class="dashboard-card dashboard-early-card">
                    <div class="dashboard-early-head">
                        <div>
                            <h3>Tempranas por empleado</h3>
                            <p>Porcentaje de entradas antes de las 08:00 entre los registros filtrados.</p>
                        </div>
                    </div>
                    <div id="dashboard-early-employee" class="dashboard-donut"></div>
                    <p id="dashboard-early-employee-meta" class="dashboard-donut-caption"></p>
                </article>
                <article class="dashboard-card dashboard-early-card">
                    <div class="dashboard-early-head">
                        <div>
                            <h3>Tempranas por departamento</h3>
                            <p>Comparativo de llegadas tempranas en el departamento seleccionado.</p>
                        </div>
                    </div>
                    <div id="dashboard-early-department" class="dashboard-donut"></div>
                    <p id="dashboard-early-department-meta" class="dashboard-donut-caption"></p>
                </article>
            </section>
            <section class="dashboard-extra">
                <article class="dashboard-card dashboard-card-wide">
                    <h3>Tendencia ultimos 7 dias</h3>
                    <p>Entradas y salidas por dia</p>
                    <div id="dashboard-chart-weekly" class="week-bars"></div>
                </article>
                <article class="dashboard-card">
                    <h3>Resumen diario</h3>
                    <p>Comparativo de movimientos del dia</p>
                    <div id="dashboard-chart" class="dashboard-chart"></div>
                </article>
                <article class="dashboard-card">
                    <h3>Entradas recientes</h3>
                    <ul id="dashboard-entradas" class="dashboard-list"></ul>
                </article>
                <article class="dashboard-card">
                    <h3>Salidas recientes</h3>
                    <ul id="dashboard-salidas" class="dashboard-list"></ul>
                </article>
            </section>
        </article>
    </template>

    <template id="tpl-empleados">
        <article class="panel split">
            <form id="form-empleado" class="form-card">
                <h2>Registro de empleado</h2>
                <input name="originalCedula" type="hidden">
                <label class="field">
                    <span>Nombre completo</span>
                    <input name="nombre" type="text" required>
                </label>
                <label class="field">
                    <span>Cedula</span>
                    <input name="cedula" type="text" required>
                </label>
                <label class="field">
                    <span>Carnet</span>
                    <input name="carnet" type="text" required>
                </label>
                <label class="field">
                    <span>Departamento</span>
                    <select name="departamento" id="departamento-select" required></select>
                </label>
                <label class="field">
                    <span>Cargo</span>
                    <select name="cargo" id="cargo-select" required></select>
                </label>
                <label class="field">
                    <span>Estado</span>
                    <select name="estado" id="estado-select" required>
                        <option value="ACTIVO">Activo</option>
                        <option value="VACACIONES">Vacaciones</option>
                        <option value="SUSPENDIDO">Suspendido</option>
                    </select>
                </label>
                <div class="report-actions">
                    <button id="btn-guardar-empleado" class="btn btn-primary" type="submit">Guardar</button>
                    <button id="btn-cancelar-edicion-empleado" class="btn btn-ghost hidden" type="button">Cancelar
                        edicion</button>
                </div>
                <p id="empleado-feedback" class="feedback"></p>
            </form>
            <div class="table-card">
                <div class="table-head">
                    <h3>Listado de empleados</h3>
                    <div style="display:flex; gap:10px; align-items:end; flex-wrap:wrap; justify-content:flex-end">
                        <label class="field" style="margin:0; min-width:180px">
                            <span style="font-size:0.82rem; color:#415066; display:block">Filtrar nombre</span>
                            <input id="filtro-nombre-empleados" type="text" placeholder="Nombre..."
                                style="padding:8px 10px; border-radius:8px; border:1px solid #dbe6f6">
                        </label>
                        <label class="field" style="margin:0; min-width:190px">
                            <span style="font-size:0.82rem; color:#415066; display:block">Filtrar departamento</span>
                            <select id="filtro-departamento-empleados"
                                style="padding:8px 10px; border-radius:8px; border:1px solid #dbe6f6">
                                <option value="">Todos</option>
                            </select>
                        </label>
                        <label class="field" style="margin:0">
                            <span style="font-size:0.82rem; color:#415066; display:block">Filtrar estado</span>
                            <select id="filtro-estado-empleados"
                                style="padding:8px 10px; border-radius:8px; border:1px solid #dbe6f6">
                                <option value="">Todos</option>
                                <option value="ACTIVO">Activo</option>
                                <option value="VACACIONES">Vacaciones</option>
                                <option value="SUSPENDIDO">Suspendido</option>
                            </select>
                        </label>
                        <button id="btn-limpiar-filtros-empleados" class="btn btn-ghost" type="button">Limpiar
                            filtros</button>
                        <button id="btn-limpiar-empleados" class="btn btn-danger" type="button">Limpiar listado</button>
                    </div>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Cedula</th>
                                <th>Carnet</th>
                                <th>Nombre</th>
                                <th>Departamento</th>
                                <th>Cargo</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-empleados"></tbody>
                    </table>
                </div>
            </div>
        </article>
    </template>

    <template id="tpl-asistencia">
        <article class="panel">
            <div class="panel-head">
                <h2>Terminal de asistencia</h2>
                <p id="reloj-digital" class="clock">00:00:00</p>
            </div>
            <div class="action-grid">
                <label class="field field-wide">
                    <span>Carnet (empleado) o cedula (invitado)</span>
                    <input id="asistencia-identificador" type="text"
                        placeholder="Carnet para empleado / Cedula para invitado" required>
                </label>
                <div id="asistencia-empleado-info" class="field field-wide hidden">
                    <span>Empleado identificado</span>
                    <div class="attendance-info-grid">
                        <div class="attendance-info-card">
                            <small>Nombre</small>
                            <strong id="asistencia-empleado-nombre">-</strong>
                        </div>
                        <div class="attendance-info-card">
                            <small>Departamento</small>
                            <strong id="asistencia-empleado-departamento">-</strong>
                        </div>
                    </div>
                </div>
                <div id="asistencia-invitado-fields" class="hidden">
                    <label class="field field-wide">
                        <span>Departamento que busca el invitado</span>
                        <select id="asistencia-departamento"></select>
                    </label>
                    <label class="field field-wide">
                        <span>Persona que busca</span>
                        <select id="asistencia-persona"></select>
                    </label>
                </div>
                <label class="field field-compact field-full">
                    <span>Observacion</span>
                    <select id="asistencia-observacion">
                        <option value="">Sin observacion</option>
                        <option value="Firma de papeles">Firma de papeles</option>
                        <option value="Entrega de documentos">Entrega de documentos</option>
                        <option value="Reunion">Reunion</option>
                        <option value="Otro">Otro</option>
                    </select>
                    <input id="asistencia-observacion-otro" class="hidden" type="text" maxlength="80"
                        placeholder="Especificar observación" style="width:180px; margin-top:6px;">
                </label>
                <div class="attendance-actions">
                    <button data-tipo="ENTRADA" class="btn btn-success" type="button">Marcar entrada</button>
                    <button data-tipo="SALIDA" class="btn btn-danger" type="button">Marcar salida</button>
                </div>
            </div>
            <p id="asistencia-feedback" class="feedback"></p>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Registro</th>
                            <th>Empleado</th>
                            <th>Departamento empleado</th>
                            <th>Cedula</th>
                            <th>Carnet</th>
                            <th>Medio</th>
                            <th>Tipo</th>
                            <th>Observacion</th>
                            <th>Departamento buscado</th>
                            <th>Persona buscada</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-asistencia"></tbody>
                </table>
            </div>
        </article>
    </template>

    <template id="tpl-archivo">
        <article class="panel archive-panel">
            <div class="panel-head">
                <div>
                    <h2>Archivo de asistencia</h2>
                    <p>Los registros del dia anterior se mueven aqui automaticamente para no saturar la pantalla
                        principal.</p>
                </div>
                <button id="btn-actualizar-archivo" class="btn btn-ghost" type="button">Sincronizar archivo</button>
            </div>
            <div class="archive-summary" id="archivo-resumen"></div>
            <p id="archivo-feedback" class="feedback"></p>
            <div class="table-wrap archive-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Registro</th>
                            <th>Empleado</th>
                            <th>Departamento empleado</th>
                            <th>Cedula</th>
                            <th>Carnet</th>
                            <th>Medio</th>
                            <th>Tipo</th>
                            <th>Observacion</th>
                            <th>Departamento buscado</th>
                            <th>Persona buscada</th>
                            <th>Horas trabajadas</th>
                            <th>Tardanza</th>
                            <th>Horas extra</th>
                            <th>Archivado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-archivo"></tbody>
                </table>
            </div>
        </article>
    </template>

    <template id="tpl-reportes">
        <article class="panel reports-panel">
            <div class="panel-head">
                <div>
                    <h2>Reportes</h2>
                    <p>Vista previa antes de descargar y filtros visuales para revisar el contenido</p>
                </div>
                <div class="report-badges">
                    <span class="badge badge-blue">Vista previa</span>
                    <span class="badge badge-red">PDF</span>
                </div>
            </div>
            <div class="report-toolbar">
                <div class="report-filters">
                    <label class="field">
                        <span>Fecha del reporte</span>
                        <input id="reporte-fecha-asistencia" type="date">
                    </label>
                    <label class="field">
                        <span>Tipo de marcación</span>
                        <select id="reporte-tipo-asistencia">
                            <option value="TODOS">Entradas y salidas</option>
                            <option value="ENTRADA">Solo entradas</option>
                            <option value="SALIDA">Solo salidas</option>
                        </select>
                    </label>
                    <button id="btn-aplicar-filtro-reporte" class="btn btn-ghost" type="button">Aplicar filtro</button>
                </div>
                <div class="report-switches">
                    <button id="btn-previa-empleados" class="btn btn-primary" type="button">Vista previa
                        empleados</button>
                    <button id="btn-previa-asistencia" class="btn btn-primary" type="button">Vista previa
                        asistencia</button>
                </div>
                <div class="report-actions">
                    <button id="btn-descargar-pdf" class="btn btn-pdf" type="button" disabled>Descargar PDF</button>
                </div>
            </div>
            <div class="report-summary">
                <article>
                    <span>Reporte activo</span>
                    <strong id="reporte-activo-nombre">Sin seleccionar</strong>
                </article>
                <article>
                    <span>Registros</span>
                    <strong id="reporte-activo-total">0</strong>
                </article>
                <article>
                    <span>Última actualización</span>
                    <strong id="reporte-activo-fecha">--</strong>
                </article>
            </div>
            <div class="report-preview-shell">
                <div class="report-preview-head">
                    <div>
                        <h3 id="reporte-preview-titulo">Vista previa del reporte</h3>
                        <p id="reporte-preview-subtitulo">Selecciona un reporte para ver los datos antes de descargar.
                        </p>
                    </div>
                    <small id="reporte-preview-meta">0 filas visibles</small>
                </div>
                <div class="table-wrap report-table-wrap">
                    <table class="report-table">
                        <thead id="reporte-preview-head"></thead>
                        <tbody id="reporte-preview-body"></tbody>
                    </table>
                </div>
            </div>
            <div id="reporte-resumen-shell" class="report-preview-shell hidden">
                <div class="report-preview-head">
                    <div>
                        <h3>Resumen total por empleado</h3>
                        <p>Consolidado de horas trabajadas, tardanza y horas extra para el reporte activo.</p>
                    </div>
                    <small id="reporte-resumen-meta">0 empleados</small>
                </div>
                <div class="table-wrap report-table-wrap">
                    <table class="report-table">
                        <thead id="reporte-resumen-head"></thead>
                        <tbody id="reporte-resumen-body"></tbody>
                    </table>
                </div>
            </div>
        </article>
    </template>

    <noscript>Este sistema requiere JavaScript para funcionar.</noscript>

    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
